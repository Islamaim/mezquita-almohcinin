<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />

<body>
  <div class="sky" aria-hidden="true"></div>

      <p class="brand__eyebrow">بِسْمِ ٱللَّهِ</p>
      <h1 class="brand__name">Mezquita Al Mohcinin</h1>

            Calle Cuenca, 10 · Gijón
          </a>
        </p>
        <p>
          <a href="mailto:info@almohcinin.es">info@almohcinin.es</a>
          <span class="dot" aria-hidden="true">·</span>
          <a href="tel:+34602021351">+34 602 02 13 51</a>

      <div class="prayers__frame-wrap">
        <iframe
          class="prayers__frame"
          title="Horarios de oración Mezquita Al Mohcinin"
          src="https://online.tawkit.net/65/mezquita-al-mohcinin-gijon"
